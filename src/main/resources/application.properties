spring.application.name=quanlyvexe
server.port=8080

# Cấu hình kết nối Microsoft SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=QuanLyVeXe;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Cấu hình Spring Data JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Cấu hình Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# Cấu hình Socket Server cho ứng dụng Client soát vé
socket.server.port=8888
