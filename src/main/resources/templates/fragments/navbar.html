<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
                <i class="bi bi-bus-front-fill me-2 fs-3"></i>
                <span>BUS TICKETING</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
                    aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}"><i class="bi bi-house-door me-1"></i>Trang chủ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/chuyen-xe/tim-kiem}"><i class="bi bi-search me-1"></i>Tìm chuyến xe</a>
                    </li>
                    
                    <!-- Menu dành cho Quản trị viên (ROLE_ADMIN) -->
                    <li class="nav-item dropdown" th:if="${session.user != null and session.user.vaiTro == 'ROLE_ADMIN'}">
                        <a class="nav-link dropdown-toggle text-warning fw-bold" href="#" id="adminDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-shield-lock me-1"></i>Quản trị
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="adminDropdown">
                            <li><a class="dropdown-item" th:href="@{/admin/tuyen-xe}"><i class="bi bi-map me-2"></i>Quản lý Tuyến xe</a></li>
                            <li><a class="dropdown-item" th:href="@{/admin/xe}"><i class="bi bi-truck me-2"></i>Quản lý Xe & Ghế</a></li>
                            <li><a class="dropdown-item" th:href="@{/admin/chuyen-xe}"><i class="bi bi-calendar3 me-2"></i>Quản lý Chuyến xe</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" th:href="@{/admin/thong-ke}"><i class="bi bi-bar-chart-fill me-2"></i>Báo cáo Doanh thu</a></li>
                        </ul>
                    </li>

                    <!-- Menu dành cho Nhân viên (ROLE_STAFF hoặc ROLE_ADMIN) -->
                    <li class="nav-item" th:if="${session.user != null and (session.user.vaiTro == 'ROLE_STAFF' or session.user.vaiTro == 'ROLE_ADMIN')}">
                        <a class="nav-link text-info fw-bold" th:href="@{/admin/ve-xe}">
                            <i class="bi bi-ticket-perforated me-1"></i>Quản lý Vé xe
                        </a>
                    </li>
                </ul>

                <!-- Menu đăng nhập / tài khoản bên phải -->
                <ul class="navbar-nav ms-auto">
                    <!-- Chưa đăng nhập -->
                    <li class="nav-item" th:if="${session.user == null}">
                        <a class="nav-link" th:href="@{/dang-nhap}"><i class="bi bi-box-arrow-in-right me-1"></i>Đăng nhập</a>
                    </li>
                    <li class="nav-item" th:if="${session.user == null}">
                        <a class="btn btn-outline-light ms-lg-2" th:href="@{/dang-ky}"><i class="bi bi-person-plus me-1"></i>Đăng ký</a>
                    </li>

                    <!-- Đã đăng nhập -->
                    <li class="nav-item dropdown" th:if="${session.user != null}">
                        <a class="nav-link dropdown-toggle fw-semibold" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-person-circle me-1"></i>
                            <span th:text="${session.user.hoTen}">Người dùng</span>
                            <span class="badge bg-light text-dark ms-1" th:text="${session.user.vaiTro}">ROLE</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                            <li><a class="dropdown-item" th:href="@{/ve-cua-toi}"><i class="bi bi-clock-history me-2"></i>Vé của tôi</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" th:href="@{/dang-xuat}"><i class="bi bi-box-arrow-right me-2"></i>Đăng xuất</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</body>
</html>
