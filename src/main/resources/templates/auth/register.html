<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::title}, ~{::content})}">
<head>
    <title>Đăng ký tài khoản - Quản Lý Vé Xe Khách</title>
</head>
<body>
    <div th:fragment="content" class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card border-0 shadow-lg rounded-4 p-4">
                    <div class="text-center mb-4">
                        <i class="bi bi-person-plus-fill text-success fs-1"></i>
                        <h3 class="fw-bold mt-2">Đăng Ký Tài Khoản</h3>
                        <p class="text-muted small">Tạo tài khoản mới để đặt vé trực tuyến nhanh chóng</p>
                    </div>

                    <form th:action="@{/dang-ky}" th:object="${nguoiDung}" method="post">
                        <div class="mb-3">
                            <label for="hoTen" class="form-label fw-semibold">Họ và tên <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="hoTen" th:field="*{hoTen}" required placeholder="VD: Nguyễn Văn A">
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-md-6">
                                <label for="taiKhoan" class="form-label fw-semibold">Tên tài khoản <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="taiKhoan" th:field="*{taiKhoan}" required placeholder="Tên đăng nhập">
                            </div>
                            <div class="col-md-6">
                                <label for="matKhau" class="form-label fw-semibold">Mật khẩu <span class="text-danger">*</span></label>
                                <input type="password" class="form-control" id="matKhau" th:field="*{matKhau}" required placeholder="Mật khẩu">
                            </div>
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-md-6">
                                <label for="email" class="form-label fw-semibold">Email <span class="text-danger">*</span></label>
                                <input type="email" class="form-control" id="email" th:field="*{email}" required placeholder="email@gmail.com">
                            </div>
                            <div class="col-md-6">
                                <label for="soDienThoai" class="form-label fw-semibold">Số điện thoại <span class="text-danger">*</span></label>
                                <input type="tel" class="form-control" id="soDienThoai" th:field="*{soDienThoai}" required placeholder="0987654321">
                            </div>
                        </div>

                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-success btn-lg fw-bold">
                                <i class="bi bi-check-circle me-1"></i> Hoàn Tất Đăng Ký
                            </button>
                        </div>

                        <div class="text-center">
                            <span class="text-muted small">Đã có tài khoản?</span>
                            <a th:href="@{/dang-nhap}" class="text-decoration-none fw-semibold">Đăng nhập</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
